<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BOSHX">
<title>BOSHX</title>
<meta name="description" content="BOSHX — play multiplayer games with friends. Playing Cards with a 3D shuffling machine.">
<meta property="og:title" content="BOSHX — play with friends">
<meta property="og:description" content="Multiplayer Playing Cards with a 3D shuffling machine. No download.">
<meta property="og:image" content="https://bhavfy.github.io/boshx/icons/og.png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
<script>try{var p=JSON.parse(localStorage.getItem('boshx.prefs')||'{}');var t=p.theme||'dark';if(t==='system')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
<div id="app"><div class="center-load"><div class="spinner"></div></div></div>
<noscript>BOSHX needs JavaScript.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
